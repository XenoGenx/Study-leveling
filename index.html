<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study leveling</title>
    <link rel="stylesheet" href="style.css?v=2.4">
</head>
<body class="welcome-page">
    <!-- DARK PORTAL BACKGROUND -->
    <div class="portal-background">
        <div class="portal-glow portal-glow-1"></div>
        <div class="portal-glow portal-glow-2"></div>
    </div>

    <!-- PARTICLE SYSTEM -->
    <div class="particle-container">
        <div class="particle purple"></div>
        <div class="particle cyan"></div>
        <div class="particle blue"></div>
        <div class="particle purple"></div>
        <div class="particle cyan"></div>
        <div class="particle blue"></div>
        <div class="particle purple"></div>
        <div class="particle cyan"></div>
        <div class="particle blue"></div>
    </div>

    <!-- SCAN LINES OVERLAY -->
    <div class="scan-lines"></div>

    <!-- MAIN NOTIFICATION WINDOW -->
    <div class="welcome-container">
        <!-- Notification Window -->
        <div class="notification-window">
            <!-- Top Corner Accents -->
            <div class="corner-accent corner-top-left"></div>
            <div class="corner-accent corner-top-right"></div>
            <div class="corner-accent corner-bottom-left"></div>
            <div class="corner-accent corner-bottom-right"></div>

            <!-- NOTIFICATION HEADER -->
            <div class="notification-header">
                <div class="notification-label">
                    <span class="label-line"></span>
                    <span>NOTIFICATION</span>
                    <span class="label-line"></span>
                </div>
            </div>

            <!-- MAIN TITLE -->
            <div class="system-title-section">
                <h1 class="system-title">STUDY LEVELING</h1>
            </div>

            <!-- MESSAGE CONTENT -->
            <div class="notification-message">
                <p class="message-en">You have been selected as a Study Hunter.</p>
                <p class="message-th">กรอกชื่อของคุณเพื่อเข้าสู่ระบบภารกิจแห่งการเรียนรู้</p>
            </div>

            <!-- HUNTER NAME INPUT -->
            <div class="input-wrapper">
                <input 
                    type="text" 
                    id="hunterNameInput" 
                    class="hunter-name-input" 
                    placeholder="Enter your Hunter Name"
                    autocomplete="off"
                    maxlength="20"
                >
                <div class="input-glow"></div>
            </div>

            <!-- STATUS DISPLAY BOX -->
            <div class="status-box">
                <div class="status-item">
                    <span class="status-label">RANK:</span>
                    <span class="status-value" id="statusRank">Unregistered</span>
                </div>
                <div class="status-item">
                    <span class="status-label">STATUS:</span>
                    <span class="status-value" id="statusMsg">Awaiting Awakening...</span>
                </div>
                <div class="status-item">
                    <span class="status-label">QUEST ACCESS:</span>
                    <span class="status-value" id="questAccess">Locked</span>
                </div>
            </div>

            <!-- MESSAGE BOX -->
            <div id="messageBox" class="message-box"></div>

            <!-- ACTION BUTTONS -->
            <div class="button-group">
                <button id="acceptQuestBtn" class="btn-primary btn-hologram">
                    <span class="btn-inner">
                        <span class="btn-text">ACCEPT QUEST</span>
                        <span class="btn-glow-line"></span>
                    </span>
                </button>
                <button id="enterGateBtn" class="btn-secondary btn-hologram">
                    <span class="btn-inner">
                        <span class="btn-text">ENTER THE GATE</span>
                        <span class="btn-glow-line"></span>
                    </span>
                </button>
            </div>

            <!-- SYSTEM FOOTER -->
            <div class="notification-footer">
                <span class="footer-text">SYSTEM INITIALIZED</span>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js"></script>
    
    <!-- Firebase Configuration -->
    <script src="firebase-config.js?v=2.4"></script>
    
    <script src="script.js?v=2.4"></script>
    <script src="welcome.js?v=2.4"></script>
</body>
</html>
