<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Gate System - Welcome Hunter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="notification-page">
    <div class="particle-container">
        <div class="particle purple"></div>
        <div class="particle cyan"></div>
        <div class="particle blue"></div>
        <div class="particle purple"></div>
        <div class="particle cyan"></div>
        <div class="particle blue"></div>
        <div class="particle purple"></div>
        <div class="particle cyan"></div>
        <div class="particle blue"></div>
    </div>

    <div class="notification-panel">
        <div class="notification-header">
            <div class="notification-label">
                <span class="scan-line"></span>
                NOTIFICATION
                <span class="scan-line"></span>
            </div>
        </div>

        <div class="notification-content">
            <div class="hologram-message">
                <h1 class="neon-cyan">You have been selected as a Study Hunter</h1>
                <p class="neon-purple subtitle">กรอกชื่อของคุณเพื่อเข้าสู่ระบบภารกิจแห่งการเรียนรู้</p>
            </div>

            <div class="hunter-input-section">
                <input 
                    type="text" 
                    id="hunterNameInput" 
                    class="hunter-name-input neon-input" 
                    placeholder="Enter your Hunter Name"
                    autocomplete="off"
                >
            </div>

            <div class="status-display">
                <div class="status-item rank-display">
                    <span class="status-label neon-purple">RANK:</span>
                    <span class="status-value neon-cyan">F-CLASS</span>
                </div>
                <div class="status-item status-info">
                    <span class="status-label neon-purple">STATUS:</span>
                    <span class="status-value neon-cyan">READY</span>
                </div>
                <div class="status-item quest-access">
                    <span class="status-label neon-purple">QUEST ACCESS:</span>
                    <span class="status-value neon-cyan">UNLOCKED</span>
                </div>
            </div>

            <div class="notification-actions">
                <button id="acceptQuestBtn" class="quest-button neon-purple">
                    <span class="button-glow"></span>
                    ACCEPT QUEST
                </button>
                <button id="enterGateBtn" class="quest-button neon-cyan">
                    <span class="button-glow"></span>
                    ENTER THE GATE
                </button>
            </div>
        </div>

        <div class="notification-footer">
            <span class="neon-purple opacity-50">SYSTEM INITIALIZED</span>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="welcome.js"></script>
</body>
</html>
