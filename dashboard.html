<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Leveling - Dashboard</title>
    <link rel="stylesheet" href="style.css?v=2.6">
</head>
<body class="dashboard-page">
    <!-- PORTAL BACKGROUND -->
    <div class="portal-background">
        <div class="portal-glow portal-glow-1"></div>
        <div class="portal-glow portal-glow-2"></div>
    </div>

    <!-- PARTICLE SYSTEM -->
    <div class="particle-container">
        <div class="particle purple"></div>
        <div class="particle cyan"></div>
        <div class="particle blue"></div>
        <div class="particle purple"></div>
        <div class="particle cyan"></div>
        <div class="particle blue"></div>
        <div class="particle purple"></div>
        <div class="particle cyan"></div>
        <div class="particle blue"></div>
    </div>

    <!-- SCAN LINES OVERLAY -->
    <div class="scan-lines"></div>

    <!-- SYSTEM BOOTING SEQUENCE -->
    <div class="system-boot-overlay" id="bootOverlay">
        <div class="boot-message">
            <div class="boot-line" id="bootLine1">▸ SYSTEM BOOTING...</div>
            <div class="boot-line" id="bootLine2" style="display:none;">▸ PLAYER DATA LOADED</div>
            <div class="boot-line" id="bootLine3" style="display:none;">▸ QUEST ACCESS GRANTED</div>
            <div class="boot-cursor"></div>
        </div>
    </div>

    <!-- SYSTEM INTERFACE HEADER -->
    <div class="dashboard-header">
        <div class="header-label">QUEST SYSTEM - ACTIVE</div>
        <div class="header-controls">
            <button id="leaderboardBtn" class="btn-leaderboard">
                <span class="btn-text">HUNTER LEADERBOARD</span>
            </button>
            <button id="logoutBtn" class="btn-logout">
                <span class="btn-text">RETURN TO GATE</span>
            </button>
        </div>
    </div>

    <!-- MAIN 3-PANEL DASHBOARD -->
    <div class="dashboard-container">
        <!-- PANEL LEFT: SKILLS & BADGES -->
        <div class="dashboard-panel panel-left" id="panelLeft">
            <div class="panel-header">
                <div class="header-bracket">[</div>
                <h2 class="header-title">ACHIEVEMENTS</h2>
                <div class="header-bracket">]</div>
            </div>
            
            <div class="panel-content">
                <div id="skillsContainer" class="skills-container">
                    <!-- Loaded by dashboard.js -->
                </div>
            </div>
            
            <div class="panel-footer">
                <div class="corner-accent corner-tl"></div>
                <div class="corner-accent corner-br"></div>
            </div>
        </div>

        <!-- PANEL CENTER: QUEST CONTROL (MAIN) -->
        <div class="dashboard-panel panel-center" id="panelCenter">
            <div class="panel-header">
                <div class="header-bracket">[</div>
                <h2 class="header-title">QUEST DISPATCH</h2>
                <div class="header-bracket">]</div>
            </div>
            
            <div class="panel-content">
                <div id="playerNameDisplay" class="player-display">
                    <span class="name-label">ACTIVE HUNTER:</span>
                    <span class="name-value" id="welcomeName">Loading...</span>
                </div>
                
                <div id="questFormContainer" class="quest-form-container">
                    <!-- Loaded by dashboard.js -->
                </div>
            </div>
            
            <div class="panel-footer">
                <div class="corner-accent corner-tl"></div>
                <div class="corner-accent corner-br"></div>
            </div>
        </div>

        <!-- PANEL RIGHT: STATUS & STATS -->
        <div class="dashboard-panel panel-right" id="panelRight">
            <div class="panel-header">
                <div class="header-bracket">[</div>
                <h2 class="header-title">PLAYER STATUS</h2>
                <div class="header-bracket">]</div>
            </div>
            
            <div class="panel-content">
                <div id="statusContainer" class="status-container">
                    <!-- Loaded by dashboard.js -->
                </div>
            </div>
            
            <div class="panel-footer">
                <div class="corner-accent corner-tl"></div>
                <div class="corner-accent corner-br"></div>
            </div>
        </div>
    </div>

    <!-- DETAIL MODAL - Badge/Skill Details -->
    <div class="detail-modal" id="detailModal">
        <div class="modal-overlay" id="modalOverlay"></div>
        <div class="modal-content" id="modalContent">
            <!-- Content will be injected by JavaScript -->
        </div>
    </div>

    <!-- Firebase SDK -->
    <script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js"></script>
    
    <!-- Firebase Configuration -->
    <script defer src="firebase-config.js?v=2.6"></script>
    
    <script defer src="script.js?v=2.6"></script>
    <script defer src="dashboard.js?v=2.6"></script>
</body>
</html>
