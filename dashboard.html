<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - STUDY GATE SYSTEM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Header Section -->
        <div class="dashboard-header">
            <div>
                <h1 class="header-title">⚔️ DASHBOARD</h1>
            </div>
            <div class="header-user">
                <div class="user-info">
                    <p class="user-name" id="headerUserName">Hunter</p>
                    <p class="user-rank" id="headerUserRank">Rank E - Level 1</p>
                </div>
                <button id="changeHunterBtn" class="btn-change-hunter">CHANGE HUNTER</button>
            </div>
        </div>

        <!-- Main Content Grid -->
        <div class="dashboard-grid">
            <!-- Stats Card -->
            <div id="statsContainer"></div>
            
            <!-- Status Grid -->
            <div id="statusContainer"></div>
            
            <!-- Badges & Skills -->
            <div id="badgesContainer"></div>
        </div>

        <!-- Recent Quests -->
        <div id="recentQuestsContainer"></div>

        <!-- Quest Form -->
        <div id="questFormContainer"></div>

        <!-- Animated Particles -->
        <div class="particles">
            <div class="particle"></div>
            <div class="particle purple"></div>
            <div class="particle"></div>
            <div class="particle pink"></div>
            <div class="particle"></div>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
