<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Gate System - Timer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="timer-page">
    <div class="particle-container">
        <div class="particle purple"></div>
        <div class="particle cyan"></div>
        <div class="particle blue"></div>
        <div class="particle purple"></div>
        <div class="particle cyan"></div>
        <div class="particle blue"></div>
        <div class="particle purple"></div>
        <div class="particle cyan"></div>
        <div class="particle blue"></div>
    </div>

    <div class="quest-progress-panel">
        <div class="quest-header">
            <div class="quest-status">
                <span class="neon-purple">QUEST IN PROGRESS</span>
            </div>
            <div class="quest-name neon-cyan" id="questNameDisplay">
                <!-- Quest name will be injected by timer.js -->
            </div>
        </div>

        <div class="timer-section">
            <div class="timer-ring-container">
                <div class="timer-ring">
                    <svg class="timer-svg" viewBox="0 0 200 200">
                        <circle class="timer-background" cx="100" cy="100" r="90"></circle>
                        <circle class="timer-progress" cx="100" cy="100" r="90"></circle>
                    </svg>
                    <div class="timer-display">
                        <span class="neon-cyan" id="timerDisplay">00:00</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="timer-controls">
            <button id="startBtn" class="timer-button neon-cyan">
                <span class="button-glow"></span>
                START
            </button>
            <button id="pauseResumeBtn" class="timer-button neon-purple" style="display:none;">
                <span class="button-glow"></span>
                <span id="pauseResume">PAUSE</span>
            </button>
            <button id="finishBtn" class="timer-button neon-purple" style="display:none;">
                <span class="button-glow"></span>
                FINISH
            </button>
        </div>

        <div class="pro-tip-area">
            <span class="neon-purple">PRO TIP:</span>
            <span class="pro-tip-text neon-cyan" id="proTip">
                Focus on your studies and make the best of your time!
            </span>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="timer.js"></script>
</body>
</html>
