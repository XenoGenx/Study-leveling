<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Mode - STUDY GATE SYSTEM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="timer-container">
        <div class="timer-panel">
            <div class="timer-title" id="questName">READING QUEST</div>
            <div class="timer-difficulty" id="questDifficulty">NORMAL</div>
            
            <!-- Timer Ring -->
            <div class="timer-ring">
                <div class="timer-circle timer-background"></div>
                <div class="timer-circle timer-progress"></div>
                <div class="timer-display">
                    <div class="timer-time" id="timerDisplay">25:00</div>
                    <div class="timer-label">FOCUS TIME</div>
                </div>
            </div>
            
            <!-- Progress Bar -->
            <div style="margin: 20px 0;">
                <div style="height: 4px; background: rgba(0, 212, 255, 0.2); border-radius: 2px; overflow: hidden;">
                    <div id="progressFill" style="height: 100%; background: linear-gradient(90deg, var(--cyan) 0%, var(--purple) 100%); width: 0%; transition: width 0.5s ease;"></div>
                </div>
            </div>
            
            <!-- Controls -->
            <div class="timer-controls">
                <button id="startBtn" class="btn-timer" style="background: linear-gradient(135deg, var(--cyan) 0%, var(--blue) 100%);">START READING</button>
                <button id="pauseBtn" class="btn-timer" style="display: none;">PAUSE</button>
                <button id="finishBtn" class="btn-timer finish">FINISH QUEST</button>
            </div>
            
            <!-- Focus Tips -->
            <div style="margin-top: 30px; padding: 15px; background: rgba(107, 95, 201, 0.1); border-radius: 8px; border-left: 3px solid var(--purple); text-align: center;">
                <p style="font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 5px;">💡 Pro Tip:</p>
                <p style="font-size: 0.85rem; color: var(--text-light);">Turn off distractions and focus on your reading. Good luck, Hunter!</p>
            </div>
        </div>
        
        <!-- Particles -->
        <div class="particles">
            <div class="particle"></div>
            <div class="particle purple"></div>
            <div class="particle"></div>
            <div class="particle pink"></div>
            <div class="particle"></div>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="timer.js"></script>
</body>
</html>
