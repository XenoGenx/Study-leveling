<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading Timer - STUDY GATE SYSTEM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="timer-container">
        <!-- Header -->
        <div class="timer-header">
            <button id="backBtn" class="btn-back">← BACK</button>
            <h1 id="chapterTitle" class="chapter-title">Chapter</h1>
            <div></div>
        </div>

        <!-- Quest Window -->
        <div class="quest-window">
            <div class="quest-header">
                <h2>IN PROGRESS</h2>
                <div class="quest-indicator">
                    <span class="indicator-dot"></span>
                    <span>QUEST ACTIVE</span>
                </div>
            </div>

            <!-- Timer Display -->
            <div class="timer-display-section">
                <div class="timer-circle">
                    <svg class="timer-svg" viewBox="0 0 200 200">
                        <circle class="timer-bg" cx="100" cy="100" r="90"></circle>
                        <circle id="timerProgress" class="timer-progress" cx="100" cy="100" r="90"></circle>
                    </svg>
                    <div class="timer-text">
                        <span id="timerMinutes" class="timer-minutes">25</span>
                        <span class="timer-colon">:</span>
                        <span id="timerSeconds" class="timer-seconds">00</span>
                    </div>
                </div>

                <!-- Goal & Status -->
                <div class="timer-info">
                    <div class="goal-box">
                        <p class="goal-label">GOAL</p>
                        <p class="goal-text">อ่านให้ครบ 25 นาที</p>
                    </div>

                    <div class="status-text" id="statusText">
                        Ready to begin your journey
                    </div>
                </div>
            </div>

            <!-- Progress Bar -->
            <div class="timer-progress-bar">
                <div id="readingProgress" class="progress-fill"></div>
                <div class="progress-glow"></div>
            </div>

            <!-- Controls -->
            <div class="timer-controls">
                <button id="startBtn" class="btn-timer-control btn-start">START</button>
                <button id="pauseBtn" class="btn-timer-control btn-pause" disabled>PAUSE</button>
                <button id="resumeBtn" class="btn-timer-control btn-resume" style="display: none;">RESUME</button>
                <button id="finishBtn" class="btn-timer-control btn-finish" disabled>FINISH READING</button>
            </div>

            <!-- Motivation Messages -->
            <div class="motivation">
                <p id="motivationText" class="motivation-text">
                    ✨ สมาธิของคุณพร้อมแล้ว ผู้ล่าผจญภัย
                </p>
            </div>
        </div>

        <!-- Stats Panel -->
        <div class="timer-stats">
            <div class="stat-box">
                <span class="stat-label">Player:</span>
                <span id="playerName" class="stat-info">-</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Chapter:</span>
                <span id="chapterName" class="stat-info">-</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Focus Mode:</span>
                <span id="focusMode" class="stat-info">Inactive</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="timer.js"></script>
</body>
</html>
