<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Gate System - Timer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="timer-page">
    <!-- PORTAL BACKGROUND -->
    <div class="portal-background">
        <div class="portal-glow portal-glow-1"></div>
        <div class="portal-glow portal-glow-2"></div>
    </div>

    <!-- PARTICLE SYSTEM -->
    <div class="particle-container">
        <div class="particle purple"></div>
        <div class="particle cyan"></div>
        <div class="particle blue"></div>
        <div class="particle purple"></div>
        <div class="particle cyan"></div>
        <div class="particle blue"></div>
        <div class="particle purple"></div>
        <div class="particle cyan"></div>
        <div class="particle blue"></div>
    </div>

    <!-- SCAN LINES OVERLAY -->
    <div class="scan-lines"></div>

    <!-- TIMER CONTAINER -->
    <div class="timer-container">
        <!-- Quest Progress Panel -->
        <div class="quest-progress-panel">
            <!-- QUEST HEADER -->
            <div class="quest-header">
                <div class="quest-status">
                    QUEST IN PROGRESS
                </div>
                <div class="quest-name" id="questName">
                    Loading Quest...
                </div>
            </div>

            <!-- TIMER RING -->
            <div class="timer-ring-container">
                <div class="timer-ring">
                    <div class="timer-display">
                        <span class="timer-time">00:00</span>
                    </div>
                </div>
            </div>

            <!-- TIMER CONTROLS -->
            <div class="timer-controls">
                <button class="btn-timer btn-start" id="startBtn">
                    <span class="btn-label">START READING</span>
                </button>
                <button class="btn-timer btn-pause" id="pauseResumeBtn" style="display: none;">
                    <span class="btn-label" id="pauseLabel">PAUSE</span>
                </button>
                <button class="btn-timer btn-finish" id="finishBtn" style="display: none;">
                    <span class="btn-label">FINISH QUEST</span>
                </button>
            </div>

            <!-- TIMER INFO -->
            <div class="timer-info">
                <span class="info-label">Focus on your reading. Every second counts!</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="timer.js"></script>
</body>
</html>
